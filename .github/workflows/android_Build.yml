name: Generate Android Build

on:
  schedule:
    - cron: '00 17 01 * *' # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_build:
    name: Generate Android Build
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies and audit
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

      # The release keystore must never be committed. Store it base64-encoded in
      # the ANDROID_KEYSTORE_BASE64 secret. The other three secrets are the
      # passwords/alias that were used when the key was generated.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets." >&2
            echo "Required: ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | openssl base64 -d -A > android/app/release.jks

      - name: Generate Android APK
        env:
          BITRISE_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.jks
          BITRISE_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          BITRISE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BITRISE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          java --version
          ./gradlew assembleRelease
          find "$PWD" -type f -name "app-release.apk"
          ls -la "$PWD/app/build/outputs/apk/release"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Bitrise.apk
          path: android/app/build/outputs/apk/release/app-release.apk
